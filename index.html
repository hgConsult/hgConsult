<title>HG Consultoria Empresarial | Contabilidade e Consultoria em Macapá</title>

<meta name="description" content="HG Consultoria Contábil e Empresarial LTDA. Serviços de contabilidade e consultoria empresarial em Macapá, Amapá.">
<meta name="keywords" content="contabilidade Macapá, contador Macapá, consultoria empresarial, HG Consultoria, contabilidade Amapá">
<meta name="author" content="HG Consultoria Contábil e Empresarial LTDA">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #0b3d5c;
        --primary-dark: #072b40;
        --secondary: #16a085;
        --accent: #20c997;
        --light: #f5f8fa;
        --dark: #172b3a;
        --text: #5f6b76;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Inter', sans-serif;
        color: var(--dark);
        background: #fff;
    }

    .navbar {
        transition: all .3s ease;
    }

    .navbar-brand {
        font-weight: 800;
        color: var(--primary) !important;
        letter-spacing: -0.5px;
    }

    .navbar-brand span {
        color: var(--secondary);
    }

    .nav-link {
        color: #40515e !important;
        font-weight: 500;
        margin: 0 6px;
    }

    .nav-link:hover {
        color: var(--secondary) !important;
    }

    .btn-primary-custom {
        background: var(--secondary);
        border: none;
        color: #fff;
        font-weight: 700;
        padding: 13px 25px;
        border-radius: 8px;
        transition: .3s;
    }

    .btn-primary-custom:hover {
        background: #11856e;
        color: #fff;
        transform: translateY(-2px);
    }

    .btn-outline-custom {
        border: 2px solid rgba(255,255,255,.8);
        color: #fff;
        font-weight: 600;
        padding: 11px 24px;
        border-radius: 8px;
        transition: .3s;
    }

    .btn-outline-custom:hover {
        background: #fff;
        color: var(--primary);
    }

    /* HERO */

    .hero {
        min-height: 720px;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(115deg, rgba(5,31,46,.98), rgba(11,61,92,.88)),
            radial-gradient(circle at top right, #16a085, transparent 40%);
    }

    .hero::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        border: 80px solid rgba(32,201,151,.08);
        border-radius: 50%;
        right: -180px;
        top: -150px;
    }

    .hero::after {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        border: 50px solid rgba(255,255,255,.04);
        border-radius: 50%;
        left: -180px;
        bottom: -180px;
    }

    .hero-content {
        position: relative;
        z-index: 2;
    }

    .hero-badge {
        display: inline-block;
        background: rgba(32,201,151,.15);
        border: 1px solid rgba(32,201,151,.35);
        color: #71f1cc;
        padding: 8px 15px;
        border-radius: 50px;
        font-size: .85rem;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .hero h1 {
        color: #fff;
        font-size: clamp(2.5rem, 5vw, 4.4rem);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -2px;
    }

    .hero h1 span {
        color: #4ee2b8;
    }

    .hero p {
        color: rgba(255,255,255,.78);
        font-size: 1.1rem;
        line-height: 1.8;
        max-width: 650px;
    }

    .hero-info {
        color: rgba(255,255,255,.75);
        margin-top: 25px;
    }

    .hero-info i {
        color: #4ee2b8;
        margin-right: 8px;
    }

    .hero-card {
        position: relative;
        z-index: 2;
        background: rgba(255,255,255,.1);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 20px;
        padding: 35px;
        color: #fff;
        box-shadow: 0 25px 70px rgba(0,0,0,.2);
    }

    .hero-card-icon {
        width: 65px;
        height: 65px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--secondary);
        border-radius: 15px;
        font-size: 28px;
        margin-bottom: 20px;
    }

    /* GENERAL */

    section {
        padding: 100px 0;
    }

    .section-label {
        color: var(--secondary);
        font-size: .85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .section-title {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--dark);
    }

    .section-description {
        color: var(--text);
        line-height: 1.8;
        max-width: 700px;
    }

    /* SOBRE */

    .about {
        background: #fff;
    }

    .about-image {
        min-height: 480px;
        background: linear-gradient(135deg, var(--primary), #117b72);
        border-radius: 25px;
        position: relative;
        overflow: hidden;
        padding: 40px;
        display: flex;
        align-items: flex-end;
    }

    .about-image::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        border: 60px solid rgba(255,255,255,.08);
        border-radius: 50%;
        top: -100px;
        right: -100px;
    }

    .about-stat {
        position: relative;
        z-index: 2;
        background: rgba(255,255,255,.1);
        backdrop-filter: blur(10px);
        padding: 25px;
        border-radius: 15px;
        color: #fff;
        width: 100%;
    }

    .about-stat h3 {
        font-size: 2.2rem;
        font-weight: 800;
    }

    .check-list {
        list-style: none;
        padding: 0;
        margin: 30px 0;
    }

    .check-list li {
        margin-bottom: 18px;
        color: var(--text);
        display: flex;
        align-items: flex-start;
    }

    .check-list i {
        color: var(--secondary);
        font-size: 20px;
        margin-right: 12px;
    }

    /* SERVIÇOS */

    .services {
        background: var(--light);
    }

    .service-card {
        height: 100%;
        background: #fff;
        padding: 35px;
        border-radius: 16px;
        border: 1px solid #e9eef1;
        transition: .3s;
    }

    .service-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 45px rgba(7,43,64,.1);
        border-color: transparent;
    }

    .service-icon {
        width: 60px;
        height: 60px;
        background: rgba(22,160,133,.1);
        color: var(--secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        font-size: 27px;
        margin-bottom: 22px;
    }

    .service-card h4 {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .service-card p {
        color: var(--text);
        line-height: 1.7;
        margin-bottom: 0;
    }

    /* DIFERENCIAIS */

    .differentials {
        background: var(--primary);
        color: #fff;
    }

    .differentials .section-title {
        color: #fff;
    }

    .differentials .section-description {
        color: rgba(255,255,255,.7);
    }

    .feature {
        display: flex;
        gap: 18px;
        margin-bottom: 30px;
    }

    .feature-icon {
        min-width: 52px;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(32,201,151,.15);
        color: #4ee2b8;
        font-size: 22px;
    }

    .feature h5 {
        font-weight: 700;
        margin-bottom: 8px;
    }

    .feature p {
        color: rgba(255,255,255,.65);
        line-height: 1.7;
        margin: 0;
    }

    /* NÚMEROS */

    .numbers {
        background: #fff;
    }

    .number-box {
        text-align: center;
        padding: 30px 15px;
    }

    .number-box i {
        color: var(--secondary);
        font-size: 32px;
        margin-bottom: 15px;
    }

    .number-box h3 {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 5px;
    }

    .number-box p {
        color: var(--text);
        margin: 0;
    }

    /* CTA */

    .cta {
        padding: 80px 0;
        background: linear-gradient(120deg, #0b3d5c, #117b72);
    }

    .cta h2 {
        color: #fff;
        font-weight: 800;
        font-size: clamp(2rem, 4vw, 3rem);
    }

    .cta p {
        color: rgba(255,255,255,.75);
    }

    /* CONTATO */

    .contact {
        background: var(--light);
    }

    .contact-card {
        background: #fff;
        padding: 35px;
        border-radius: 18px;
        height: 100%;
        border: 1px solid #e8edef;
    }

    .contact-item {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
    }

    .contact-icon {
        min-width: 48px;
        width: 48px;
        height: 48px;
        background: rgba(22,160,133,.1);
        color: var(--secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        font-size: 21px;
    }

    .contact-item h6 {
        font-weight: 700;
        margin-bottom: 5px;
    }

    .contact-item p,
    .contact-item a {
        color: var(--text);
        text-decoration: none;
        margin: 0;
        line-height: 1.6;
    }

    .contact-item a:hover {
        color: var(--secondary);
    }

    .map-container {
        border-radius: 18px;
        overflow: hidden;
        height: 100%;
        min-height: 420px;
        box-shadow: 0 15px 40px rgba(0,0,0,.08);
    }

    .map-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }

    /* FOOTER */

    footer {
        background: #061f2e;
        color: rgba(255,255,255,.65);
        padding: 60px 0 25px;
    }

    .footer-brand {
        color: #fff;
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 15px;
    }

    .footer-brand span {
        color: var(--accent);
    }

    footer p {
        line-height: 1.8;
    }

    .footer-title {
        color: #fff;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .footer-links {
        list-style: none;
        padding: 0;
    }

    .footer-links li {
        margin-bottom: 10px;
    }

    .footer-links a {
        color: rgba(255,255,255,.6);
        text-decoration: none;
        transition: .2s;
    }

    .footer-links a:hover {
        color: #4ee2b8;
    }

    .footer-bottom {
        border-top: 1px solid rgba(255,255,255,.1);
        margin-top: 40px;
        padding-top: 25px;
        font-size: .9rem;
    }

    /* WHATSAPP */

    .whatsapp-float {
        position: fixed;
        width: 60px;
        height: 60px;
        right: 25px;
        bottom: 25px;
        background: #25d366;
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        text-decoration: none;
        z-index: 999;
        box-shadow: 0 8px 25px rgba(37,211,102,.4);
        transition: .3s;
    }

    .whatsapp-float:hover {
        color: #fff;
        transform: scale(1.1);
    }

    /* RESPONSIVO */

    @media (max-width: 991px) {
        .hero {
            min-height: auto;
            padding: 140px 0 90px;
        }

        .hero-card {
            margin-top: 40px;
        }

        section {
            padding: 75px 0;
        }

        .about-image {
            min-height: 350px;
            margin-bottom: 40px;
        }
    }

    @media (max-width: 576px) {
        .hero h1 {
            letter-spacing: -1px;
        }

        .hero-card {
            padding: 25px;
        }

        .about-image {
            min-height: 300px;
        }

        .whatsapp-float {
            width: 55px;
            height: 55px;
            right: 18px;
            bottom: 18px;
        }
    }
</style>
